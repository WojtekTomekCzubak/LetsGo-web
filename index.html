    <title>LetsGo</title>
    <script>
      // Apply the saved theme before the first paint, so a dark theme does not flash white (src/ui/theme.ts does the rest).
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('letsgo-theme') || '{}');
          var dark = t.mode === 'dark' || (t.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (/^#[0-9a-f]{6}$/i.test(t.accent || '')) document.documentElement.style.setProperty('--accent', t.accent);
        } catch (e) {}
      })();
    </script>
